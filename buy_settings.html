<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Buy Robot — Settings</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
:root {
  --bg:     #050810;
  --panel:  #0a0d16;
  --border: #1c2438;
  --cyan:   #00d4ff;
  --green:  #00e87a;
  --green-d:rgba(0,232,122,.11);
  --red:    #ff3d5c;
  --red-d:  rgba(255,61,92,.12);
  --amber:  #ffb020;
  --amber-d:rgba(255,176,32,.12);
  --text:   #c8daf0;
  --text2:  #4e6585;
  --mono:   'IBM Plex Mono', monospace;
  --ui:     'Space Grotesk', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--ui);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}

.card{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.card-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.card-hdr span{font-size:14px;font-weight:700;}
.card-hdr .sub{font-size:10px;color:var(--text2);font-family:var(--mono);margin-left:auto;}
.card-body{padding:18px;}

label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px;letter-spacing:.3px;}
textarea{width:100%;background:#080c15;border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:11px;padding:10px 12px;resize:vertical;line-height:1.6;outline:none;transition:.15s;}
textarea:focus{border-color:rgba(0,212,255,.5);box-shadow:0 0 0 2px rgba(0,212,255,.08);}
.hint{font-size:9px;color:var(--text2);margin-top:5px;font-family:var(--mono);}

.btn{width:100%;margin-top:14px;padding:10px;border-radius:7px;border:none;background:linear-gradient(135deg,var(--cyan),#00c9b1);color:#050810;font-family:var(--ui);font-size:12px;font-weight:700;cursor:pointer;transition:.15s;}
.btn:hover{opacity:.85;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.toast{position:fixed;top:16px;right:16px;z-index:99;padding:9px 14px;border-radius:7px;font-family:var(--mono);font-size:11px;border:1px solid transparent;max-width:380px;transform:translateX(120%);transition:transform .25s ease;}
.toast.show{transform:translateX(0);}
.toast.success{background:var(--green-d);color:var(--green);border-color:rgba(0,232,122,.3);}
.toast.error{background:var(--red-d);color:var(--red);border-color:rgba(255,61,92,.3);}
.toast.warn{background:var(--amber-d);color:var(--amber);border-color:rgba(255,176,32,.3);}

.nav{margin-bottom:18px;display:flex;gap:8px;}
.nav a{padding:4px 12px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:11px;text-decoration:none;transition:.15s;}
.nav a:hover{color:var(--text);background:#0f1420;}
.nav a.active{color:var(--cyan);border-color:rgba(0,212,255,.35);background:rgba(0,212,255,.07);}
</style>
</head>
<body>

<div class="nav">
  <a href="/">Dashboard</a>
  <a href="/settings" class="active">Settings</a>
</div>

<div class="card">
  <div class="card-hdr">
    <span>Zerodha Enctoken</span>
    <span class="sub">restart WS after save</span>
  </div>
  <div class="card-body">
    <label for="enctoken">enctoken</label>
    <textarea id="enctoken" rows="5" placeholder="Paste full enctoken value from Zerodha cookie…"></textarea>
    <div class="hint">Browser DevTools → Application → Cookies → kite.zerodha.com → enctoken</div>
    <button class="btn" id="saveBtn" onclick="save()">Save to config.py</button>
  </div>
</div>

<div class="card" style="margin-top:14px;">
  <div class="card-hdr">
    <span>Trading Hours</span>
    <span class="sub">applied immediately, no restart needed</span>
  </div>
  <div class="card-body">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div>
        <label>Trade Start (HH:MM)</label>
        <input type="time" id="tradeStart" style="width:100%;background:#080c15;border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:12px;padding:8px 10px;outline:none;"/>
      </div>
      <div>
        <label>Trade End (HH:MM)</label>
        <input type="time" id="tradeEnd" style="width:100%;background:#080c15;border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:12px;padding:8px 10px;outline:none;"/>
      </div>
      <div>
        <label>Force Exit (HH:MM)</label>
        <input type="time" id="forceExit" style="width:100%;background:#080c15;border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:12px;padding:8px 10px;outline:none;"/>
      </div>
    </div>
    <button class="btn" id="saveTimeBtn" onclick="saveTimes()" style="margin-top:14px;">Save Trading Hours</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const socket = io();

function showToast(type, msg, ms = 3500) {
  const t = document.getElementById('toast');
  t.className = 'toast ' + type;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), ms);
}

function save() {
  const val = document.getElementById('enctoken').value.trim();
  if (!val) { showToast('error', 'Enctoken cannot be empty'); return; }
  document.getElementById('saveBtn').disabled = true;
  socket.emit('update_config', { enctoken: val });
}

socket.on('connect', () => socket.emit('get_config'));

socket.on('config_snapshot', d => {
  if (d.enctoken) document.getElementById('enctoken').value = d.enctoken;
  if (d.trade_start_h != null && d.trade_start_m != null)
    document.getElementById('tradeStart').value =
      String(d.trade_start_h).padStart(2,'0') + ':' + String(d.trade_start_m).padStart(2,'0');
  if (d.trade_end_h != null && d.trade_end_m != null)
    document.getElementById('tradeEnd').value =
      String(d.trade_end_h).padStart(2,'0') + ':' + String(d.trade_end_m).padStart(2,'0');
  if (d.force_exit_h != null && d.force_exit_m != null)
    document.getElementById('forceExit').value =
      String(d.force_exit_h).padStart(2,'0') + ':' + String(d.force_exit_m).padStart(2,'0');
});

function saveTimes() {
  const start = document.getElementById('tradeStart').value;
  const end   = document.getElementById('tradeEnd').value;
  const force = document.getElementById('forceExit').value;
  if (!start || !end || !force) { showToast('error', 'All time fields are required'); return; }
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  const [fh, fm] = force.split(':').map(Number);
  if (sh * 60 + sm >= eh * 60 + em) { showToast('error', 'Trade End must be after Trade Start'); return; }
  document.getElementById('saveTimeBtn').disabled = true;
  socket.emit('update_rc', {
    trade_start_h: sh, trade_start_m: sm,
    trade_end_h:   eh, trade_end_m:   em,
    force_exit_h:  fh, force_exit_m:  fm,
  });
  showToast('success', `Hours set: ${start}–${end}, force exit ${force}`);
  setTimeout(() => document.getElementById('saveTimeBtn').disabled = false, 1000);
}

socket.on('config_saved', d => {
  document.getElementById('saveBtn').disabled = false;
  const needsRestart = d.restart_needed && d.restart_needed.length;
  showToast(needsRestart ? 'warn' : 'success',
    needsRestart ? 'Saved — restart WS to apply' : 'Enctoken saved successfully');
});
</script>
</body>
</html>
